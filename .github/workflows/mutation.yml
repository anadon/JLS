name: Mutation testing (PIT)

# Blocking mutation-coverage ratchet (issue #159, promoted 2026-07-27
# from the #161 report-only trial): the opt-in `pitest` Maven profile
# runs on a weekly cadence and on demand, never on push/pull_request,
# so it is never a required PR check. The profile now carries
# mutationThreshold/testStrengthThreshold floors (see the pitest
# profile in pom.xml), so a mutation-score breach turns this weekly
# run red instead of silently degrading. The PIT report is uploaded
# even on a breach so the failing run is diagnosable.
on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

# least-privilege token: the job only reads the repo (mirrors ci.yml, #68)
permissions:
  contents: read

jobs:
  mutation-report:
    name: PIT mutation report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # the ratchet's scope is headless-only (docs/mutation-testing-trial-2026-07.md
      # §2/§6); no xvfb needed here.
      - name: Run PIT mutation coverage
        run: mvn -B -Ppitest test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pit-reports
          path: target/pit-reports
          if-no-files-found: warn
